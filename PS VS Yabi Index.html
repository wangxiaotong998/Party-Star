<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقارنة الأرباح: PS vs Yabi</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 15px; background: #f9f9f9; transition: direction 0.2s; }
  h2 { text-align: center; color: #333; margin-bottom: 10px; }
  .lang-switch { text-align: center; margin-bottom: 20px; }
  .lang-switch button { padding: 8px 20px; border: 1px solid #888; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
  .lang-switch button:hover { background: #eee; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .btns button { padding: 10px 15px; border: 1px solid #aaa; background: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; }
  .btns button:hover { background: #eee; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 15px; }
  th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
  th { background: #f0f0f0; }
  .win { color: #d32f2f; font-weight: bold; }
  .lose { color: #7b1fa2; font-weight: bold; }
  .tier-tag { padding: 2px 6px; border-radius: 3px; color: #fff; font-size: 12px; }
  .S { background: #e53935; } .A { background: #fb8c00; } .B { background: #43a047; } .C { background: #1e88e5; } .D { background: #757575; }
  .note { font-size: 13px; color: #666; text-align: center; }
  html[dir="ltr"] body { direction: ltr; }
  html[dir="ltr"] table th, html[dir="ltr"] table td { text-align: center; }
</style>
</head>
<body>

<h2 id="title">مقارنة الأرباح: PS vs Yabi</h2>

<div class="lang-switch">
  <button onclick="toggleLang()" id="langBtn">中文</button>
</div>

<div class="btns" id="presetBtns"></div>
<div id="output"></div>
<div class="note" id="noteText">ملاحظة: PS يُسوّى حسب أعلى شريحة مكتملة؛ عمولة Yabi للوكالات تُحدد تلقائياً حسب إجمالي الماس الشهري (S/A/B/C/D: 20%/15%/10%/5%)، والمذيع يحصل على 1$ مقابل كل 11777 ماس.</div>

<script>
const i18n = {
  ar: {
    title: "مقارنة الأرباح: PS vs Yabi",
    btn: "中文",
    note: "ملاحظة: PS يُسوّى حسب أعلى شريحة مكتملة؛ عمولة Yabi للوكالات تُحدد تلقائياً حسب إجمالي الماس الشهري (S/A/B/C/D: 20%/15%/10%/5%)، والمذيع يحصل على 1$ مقابل كل 11777 ماس.",
    platform: { ps: "PS", yabi: "Yabi" },
    headers: ["المنصة", "عدد الماس", "هدية المذيع / المستلم", "الراتب المتوقع", "عمولة الوكالة", "شريحة Yabi"],
    recharge: "الشحن",
    hostCompare: "مقارنة المذيع: ",
    agencyCompare: "مقارنة الوكالة: ",
    psMore: "PS أكثر بـ ",
    yabiMore: "Yabi أكثر بـ ",
    tier: "شريحة",
    psGift: "ماس",
    yabiGift: (amt) => `$${amt.toFixed(2)} (${amt.toFixed(0)} ماس ÷ 11777)`
  },
  zh: {
    title: "PS vs Yabi 收益对比",
    btn: "العربية",
    note: "注：PS按最高达标档位结算；Yabi公会按当月总钻石自动匹配S/A/B/C/D档（20%/15%/10%/5%），主播固定11777钻=1美金。",
    platform: { ps: "PS", yabi: "Yabi" },
    headers: ["平台", "钻石数", "主播收礼/到手", "主播预估薪资", "公会预估提成", "Yabi公会档位"],
    recharge: "充值",
    hostCompare: "主播对比：",
    agencyCompare: "公会对比：",
    psMore: "PS 多 ",
    yabiMore: "Yabi 多 ",
    tier: "档",
    psGift: "钻",
    yabiGift: (amt) => `$${amt.toFixed(2)} (${amt.toFixed(0)}钻÷11777)`
  }
};

let currentLang = 'ar';

const psData = [
  [25000, 23, 5], [50000, 45, 10], [100000, 90, 20], [150000, 130, 25],
  [250000, 216, 38], [350000, 303, 53], [500000, 433, 75], [750000, 643, 116],
  [1000000, 857, 155], [1250000, 1072, 194], [1500000, 1286, 233], [2000000, 1699, 320],
  [2500000, 2123, 400], [3000000, 2548, 480], [3500000, 2972, 560], [4000000, 3397, 640],
  [4500000, 3822, 720], [5000000, 4246, 800], [7500000, 6369, 1200], [10000000, 8493, 1600],
  [12500000, 10616, 2000], [15000000, 12739, 2400], [20000000, 16985, 3200], [25000000, 21232, 4000],
  [30000000, 25478, 4800], [35000000, 29724, 5600], [40000000, 33971, 6400], [45000000, 38368, 7105],
  [50000000, 42632, 7895], [55000000, 47020, 8650], [65000000, 55618, 10052], [75000000, 63947, 11842],
  [85000000, 72735, 13145], [100000000, 85262, 15788], [120000000, 102310, 18955], [150000000, 127885, 23690],
  [200000000, 170513, 31587], [250000000, 213142, 39483], [300000000, 255770, 47380]
];

const yabiTiers = [
  { name: 'S', min: 90000000, rate: 0.20 },
  { name: 'A', min: 35000000, rate: 0.15 },
  { name: 'B', min: 8000000, rate: 0.10 },
  { name: 'C', min: 1800000, rate: 0.05 },
  { name: 'D', min: 0, rate: 0.05 }
];

const presets = [2, 5, 10, 50, 100, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];

function getPSTier(dia) {
  let res = [0, 0, 0];
  for (const t of psData) {
    if (dia >= t[0]) res = t; else break;
  }
  return res;
}
function getYabiTier(dia) {
  for (const t of yabiTiers) if (dia >= t.min) return t;
  return yabiTiers[4];
}

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'zh' : 'ar';
  document.documentElement.lang = currentLang === 'ar' ? 'ar' : 'zh-CN';
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('title').innerText = i18n[currentLang].title;
  document.getElementById('langBtn').innerText = i18n[currentLang].btn;
  document.getElementById('noteText').innerText = i18n[currentLang].note;
  calc(window._lastUsd || 100);
}

function calc(usd) {
  window._lastUsd = usd;
  const t = i18n[currentLang];
  const psDia = Math.floor(usd * 970);
  const yabiDia = usd * 10000;
  const psTier = getPSTier(psDia);
  const psHost = psTier[1], psAgency = psTier[2];
  const yabiHost = yabiDia / 11777;
  const yTier = getYabiTier(yabiDia);
  const yabiAgency = yabiHost * yTier.rate;

  let html = `
    <h3>${t.recharge} $${usd.toLocaleString()}</h3>
    <table>
      <tr>${t.headers.map(h => `<th>${h}</th>`).join('')}</tr>
      <tr>
        <td><strong>${t.platform.ps}</strong></td>
        <td>${psDia.toLocaleString()}</td>
        <td>${psDia.toLocaleString()} ${t.psGift}</td>
        <td>$${psHost.toLocaleString()}</td>
        <td>$${psAgency.toLocaleString()}</td>
        <td>-</td>
      </tr>
      <tr>
        <td><strong>${t.platform.yabi}</strong></td>
        <td>${yabiDia.toLocaleString()}</td>
        <td>${t.yabiGift(yabiHost)}</td>
        <td>$${yabiHost.toFixed(2)}</td>
        <td>$${yabiAgency.toFixed(2)}</td>
        <td><span class="tier-tag ${yTier.name}">${yTier.name} ${(yTier.rate*100)}%</span></td>
      </tr>
    </table>
    <p><strong>${t.hostCompare}</strong> 
      ${psHost > yabiHost ? `<span class="win">${t.psMore} $${(psHost - yabiHost).toFixed(2)}</span>` : `<span class="lose">${t.yabiMore} $${(yabiHost - psHost).toFixed(2)}</span>`}
    </p>
    <p><strong>${t.agencyCompare}</strong> 
      ${psAgency > yabiAgency ? `<span class="win">${t.psMore} $${(psAgency - yabiAgency).toFixed(2)}</span>` : `<span class="lose">${t.yabiMore} $${(yabiAgency - psAgency).toFixed(2)} (${t.tier}:${yTier.name})</span>`}
    </p>
  `;
  document.getElementById('output').innerHTML = html;
}

const btnBox = document.getElementById('presetBtns');
presets.forEach(v => {
  const b = document.createElement('button');
  b.innerText = '$' + v.toLocaleString();
  b.onclick = () => calc(v);
  btnBox.appendChild(b);
});

calc(100);
</script>
</body>
</html>
